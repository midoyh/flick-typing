<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111827">
<title>フリックタイピング</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8;--good:#4ade80;--bad:#fb7185;--gold:#fbbf24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(160deg,#0f172a,#111827);color:var(--text)}
body{display:flex;justify-content:center}
.app{width:100%;max-width:560px;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:22px;margin:0}.badge{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.stat{background:rgba(30,41,59,.9);border:1px solid #334155;border-radius:14px;padding:10px;text-align:center}
.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:22px}
.card{background:rgba(30,41,59,.96);border:1px solid #334155;border-radius:22px;padding:24px 18px;box-shadow:0 15px 40px rgba(0,0,0,.22)}
#target{font-size:clamp(34px,10vw,54px);font-weight:800;text-align:center;letter-spacing:.08em;min-height:70px;display:flex;align-items:center;justify-content:center}
#hint{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 18px}
.input-wrap{position:relative}
input{width:100%;height:58px;border:2px solid #475569;border-radius:15px;background:#0f172a;color:#fff;font-size:24px;text-align:center;outline:none;padding:0 14px;-webkit-appearance:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(56,189,248,.12)}
input.good{border-color:var(--good)} input.bad{border-color:var(--bad)}
.feedback{height:30px;text-align:center;padding-top:8px;font-weight:700;font-size:14px}
#combo{color:var(--gold);text-align:center;height:28px;font-weight:800}
.actions{display:flex;gap:10px;margin-top:16px}
button{flex:1;height:52px;border:0;border-radius:15px;font-size:16px;font-weight:800;color:white;background:#475569}
button.primary{background:linear-gradient(135deg,#0284c7,#2563eb)}
button:active{transform:scale(.98)}
.screen{display:none}.screen.active{display:block}
.start{margin-top:auto;margin-bottom:auto}
.start p{color:var(--muted);line-height:1.7}
.settings{display:flex;gap:8px;margin:12px 0}.settings button{height:42px;font-size:13px}.settings button.selected{outline:2px solid var(--accent);background:#075985}
.result{text-align:center}.result .score{font-size:58px;font-weight:900;margin:8px 0;color:var(--gold)}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.result-item{background:#0f172a;border-radius:14px;padding:13px 8px}.result-item small{display:block;color:var(--muted);font-size:11px}.result-item b{font-size:20px}

/* ランキング関連CSS */
.ranking-box{margin-top:18px;background:#0f172a;border-radius:16px;padding:14px;text-align:left;border:1px solid #334155}
.ranking-box h3{margin:0 0 10px;font-size:15px;color:var(--accent);text-align:center}
.ranking-list{list-style:none;padding:0;margin:0;font-family:monospace,sans-serif;font-size:13px;line-height:1.8}
.ranking-item{display:flex;justify-content:space-between;padding:3px 6px;border-radius:6px;color:var(--muted)}
.ranking-item.highlight{background:rgba(56,189,248,.18);color:#fff;font-weight:bold;border:1px solid var(--accent)}
.full-ranking-container{max-height:360px;overflow-y:auto;padding-right:4px}
.full-ranking-container::-webkit-scrollbar{width:6px}
.full-ranking-container::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}

footer{text-align:center;color:#64748b;font-size:11px;margin-top:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="app">
<header><h1>📱 フリックタイピング</h1><span class="badge">iPhone Safari版</span></header>

<section id="startScreen" class="screen active start">
<div class="card">
<h2>30秒で何文字打てる？</h2>
<p>表示された日本語を、iPhoneの<strong>かなフリック入力</strong>で入力してください。正解するとすぐ次のお題へ進みます。</p>
<div class="settings">
<button data-time="10">10秒</button><button data-time="30" class="selected">30秒</button><button data-time="60">60秒</button>
</div>
<button id="startBtn" class="primary">ゲームスタート</button>
<button id="viewRankingBtn" style="margin-top:10px;">🏆 ランキングを見る</button>
</div>
</section>

<section id="gameScreen" class="screen">
<div class="stats">
<div class="stat"><small>残り時間</small><b id="time">30</b></div>
<div class="stat"><small>入力文字数</small><b id="totalChars">0</b></div>
<div class="stat"><small>正解</small><b id="correct">0</b></div>
</div>
<div class="card">
<div id="target">スタート！</div>
<div id="hint">お題をフリック入力</div>
<div class="input-wrap">
<input id="answer" type="text" inputmode="kana" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="回答入力">
</div>
<div id="feedback" class="feedback"></div>
<div id="combo"></div>
<div class="actions">
<button id="skipBtn">スキップ</button>
<button id="inGameHomeBtn">タイトルへ</button>
</div>
</div>
</section>

<section id="resultScreen" class="screen">
<div class="card result">
<div>RESULT</div>
<div id="finalScore" class="score">0</div>
<div>入力文字数</div>
<div class="result-grid">
<div class="result-item"><small>入力単語数</small><b id="finalWords">0</b></div>
<div class="result-item"><small>文字/10秒</small><b id="finalSpeed">0</b></div>
<div class="result-item"><small>最大コンボ</small><b id="finalCombo">0</b></div>
</div>

<!-- リザルト画面の近接ランキング表示 -->
<div class="ranking-box">
<h3>🏆 ランキング (今回周辺)</h3>
<ul id="resultRankingList" class="ranking-list"></ul>
</div>

<div class="actions"><button id="retryBtn" class="primary">もう一度</button><button id="homeBtn">タイトルへ</button></div>
</div>
</section>

<!-- 全体ランキング画面 -->
<section id="rankingScreen" class="screen">
<div class="card result">
<h2>🏆 全体ランキング (TOP 50)</h2>
<div id="rankingModeTitle" style="color:var(--muted);font-size:13px;margin-bottom:12px;">30秒モード</div>
<div class="ranking-box full-ranking-container">
<ul id="fullRankingList" class="ranking-list"></ul>
</div>
<div class="actions" style="margin-top:16px;"><button id="rankingBackBtn" class="primary">タイトルへ戻る</button></div>
</div>
</section>

<footer>iPhoneでは「ホーム画面に追加」するとアプリのように遊べます。</footer>
</main>

<script>
const WORDS = [
  // 既存の単語
  "りんご","みかん","すいか","ぶどう","いちご","もも","ばなな","さくらんぼ","れもん","めろん",
  "とうきょう","よこはま","おおさか","きょうと","なごや","さっぽろ","ふくおか","おきなわ","ちば","まちだ","うらやす",
  "でんしゃ","えき","ひこうき","くるま","じてんしゃ","しんかんせん","ちかてつ","ばす","たくしー","ほてる",
  "ごはん","らーめん","すし","やきにく","おにぎり","たまごやき","からあげ","みそしる","かれーらいす","ぱすた",
  "ねこ","いぬ","うさぎ","ぱんだ","きつね","たぬき","さる","ぞう","きりん","ぺんぎん","みどくん","ともやくん","きみちゃん","みどりかわ","すぎた",
  "たいよう","つき","ほし","そら","くもり","あめ","ゆき","かぜ","うみ","やま",
  "おんがく","えいが","げーむ","ほん","まんが","しゃしん","りょこう","さんぽ","すぽーつ","どらま","あそべる？","できた？","めあど！",
  "あさごはん","ひるごはん","ばんごはん","のみもの","くだもの","やさい","ちょこれーと","あいすくりーむ","けーき","ぷりん",
  "きょう","あした","きのう","こんしゅう","らいしゅう","げつようび","すいようび","きんようび","どようび","にちようび",
  "ありがとう","おはよう","こんにちは","こんばんは","おやすみ","おめでとう","だいじょうぶ？","がんばろ！","たのしい！","うれしい！",
  "おつかれ！","またねー","まじで？","よろしくね","ほんと？",
  "いいね！","やばい！","なるほどー","わかるー","どうしたの？",
  "おねがい","ごめんね","どうぞー","すき！","さいこう！",
  "すまほ","こんびに","かふぇ","いやほん","あぷり",
  "おやつ","じゅーす","おふろ","おうち","おさんぽ",
  "おかいもの","おどうぐ","おべんとう","おかし","おそうじ",
  "どこいく？","なにする？","いつひま？","もうつくよ","いまどこ？",
  "ねむいー","おなかすいた","のどかわいた","つかれたー","ひまー",
  "あついね","さむいね","たのしみ！","うれしいー","びっくり！",
  "えーっと","まあいいか","やっぱり","ちょっとまって","またあとで",
  "19940628","20001004","1がつ","2がつ","3がつ",
  "4がつ","5がつ","6がつ","7がつ","8がつ",
  "9がつ","10がつ","11がつ","12がつ","2026ねん",
  "え、まって！","がんばる","らいん"
];

const $=id=>document.getElementById(id);
let duration=30,timeLeft=30,timer=null,current="",totalChars=0,correct=0,attempts=0,combo=0,maxCombo=0,startedAt=0;
let lastIndex=-1;
let isProcessing=false;

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
function pickWord(){
 isProcessing = false;
 let i; do{i=Math.floor(Math.random()*WORDS.length)}while(i===lastIndex&&WORDS.length>1);
 lastIndex=i; current=WORDS[i]; $("target").textContent=current;
 $("answer").value=""; $("feedback").textContent=""; $("answer").className="";
 $("combo").textContent=combo>=2?`${combo} COMBO`:"";
}
function updateStats(){$("time").textContent=timeLeft;$("totalChars").textContent=totalChars;$("correct").textContent=correct}
function startGame(){
 clearInterval(timer); timeLeft=duration;totalChars=0;correct=0;attempts=0;combo=0;maxCombo=0;lastIndex=-1;startedAt=Date.now();
 show("gameScreen");updateStats();pickWord();
 setTimeout(()=>{$("answer").focus()},100);
 timer=setInterval(()=>{timeLeft--;updateStats();if(timeLeft<=0)endGame()},1000);
}
function normalize(s){return s.trim().replace(/\s+/g,"")}

function isInputValid(input, target){
 if(target.startsWith(input)) return true;
 if(input.length > target.length) return false;
 
 const confirmedInput = input.slice(0, -1);
 const confirmedTarget = target.slice(0, input.length - 1);
 
 if(confirmedInput !== confirmedTarget) return false;
 return true;
}

function answerChanged(){
 if(!current||timeLeft<=0||isProcessing)return;
 const v=normalize($("answer").value);
 if(v==="")return;
 attempts++;
 
 if(v===current){
   isProcessing = true;
   correct++;combo++;maxCombo=Math.max(maxCombo,combo);
   totalChars += current.length;
   $("answer").className="good";
   $("answer").value="";
   updateStats();
   setTimeout(()=>{if(timeLeft>0)pickWord()},50);
 }else if(!isInputValid(v, current)){
   combo=0;$("answer").className="bad";$("feedback").textContent="もう一度！";
   $("combo").textContent="";
 }
}

function skip(){
 if(isProcessing) return;
 attempts++;combo=0;$("feedback").textContent="→ スキップ";
 setTimeout(()=>{if(timeLeft>0)pickWord()},70);
}

// --- ランキング管理ロジック ---
function getStorageKey(){
 return `flick_typing_ranking_${duration}s`;
}

function loadRankings(){
 const data = localStorage.getItem(getStorageKey());
 return data ? JSON.parse(data) : [];
}

function saveRankings(rankings){
 localStorage.setItem(getStorageKey(), JSON.stringify(rankings));
}

function formatDate(d){
 const year = d.getFullYear();
 const month = String(d.getMonth() + 1).padStart(2, '0');
 const day = String(d.getDate()).padStart(2, '0');
 return `${year}/${month}/${day}`;
}

function recordScore(chars){
 const rankings = loadRankings();
 const newRecord = {
   chars: chars,
   date: formatDate(new Date()),
   id: Date.now() + Math.random()
 };
 
 rankings.push(newRecord);
 rankings.sort((a,b) => b.chars - a.chars);
 
 const trimmed = rankings.slice(0, 50);
 saveRankings(trimmed);
 
 const rankIndex = trimmed.findIndex(r => r.id === newRecord.id);
 return { rankings: trimmed, myRankIndex: rankIndex };
}

function renderResultRanking(rankings, myRankIndex){
 const listEl = $("resultRankingList");
 listEl.innerHTML = "";
 
 if(myRankIndex === -1){
   listEl.innerHTML = "<li class='ranking-item'>ランク外（TOP 50未満）</li>";
   return;
 }
 
 let start = Math.max(0, myRankIndex - 2);
 let end = Math.min(rankings.length, start + 5);
 if (end - start < 5) {
   start = Math.max(0, end - 5);
 }
 
 for(let i = start; i < end; i++){
   const r = rankings[i];
   const li = document.createElement("li");
   li.className = "ranking-item" + (i === myRankIndex ? " highlight" : "");
   li.innerHTML = `<span>${i + 1}位 ${r.date}</span><span>入力文字数 ${r.chars}</span>`;
   listEl.appendChild(li);
 }
}

function renderFullRanking(){
 const rankings = loadRankings();
 const listEl = $("fullRankingList");
 $("rankingModeTitle").textContent = `${duration}秒モード`;
 listEl.innerHTML = "";
 
 if(rankings.length === 0){
   listEl.innerHTML = "<li class='ranking-item' style='justify-content:center;'>まだ記録がありません</li>";
   return;
 }
 
 rankings.forEach((r, i) => {
   const li = document.createElement("li");
   li.className = "ranking-item";
   li.innerHTML = `<span>${i + 1}位 ${r.date}</span><span>入力文字数 ${r.chars}</span>`;
   listEl.appendChild(li);
 });
}

function endGame(){
 if(!timer)return; clearInterval(timer);timer=null;
 const elapsed=Math.max(1,(Date.now()-startedAt)/1000);
 const speedPer10Sec = (totalChars / elapsed * 10).toFixed(1);
 
 $("finalScore").textContent=totalChars;
 $("finalWords").textContent=correct; // 単語数（正解数）を表示
 $("finalSpeed").textContent=speedPer10Sec;
 $("finalCombo").textContent=maxCombo;
 
 const { rankings, myRankIndex } = recordScore(totalChars);
 renderResultRanking(rankings, myRankIndex);
 
 show("resultScreen");
}

function goHome(){
 clearInterval(timer);
 timer=null;
 show("startScreen");
}

document.querySelectorAll("[data-time]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-time]").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");duration=+b.dataset.time}));
$("startBtn").addEventListener("click",startGame);
$("retryBtn").addEventListener("click",startGame);
$("homeBtn").addEventListener("click",goHome);
$("inGameHomeBtn").addEventListener("click",goHome);
$("viewRankingBtn").addEventListener("click",()=>{ renderFullRanking(); show("rankingScreen"); });
$("rankingBackBtn").addEventListener("click",goHome);
$("answer").addEventListener("input",answerChanged);
$("skipBtn").addEventListener("click",skip);
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();skip()}});
document.addEventListener("touchstart",()=>{}, {passive:true});
</script>
</body>
</html>
